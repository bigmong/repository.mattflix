name: Rebuild & Publish Repo

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Which addon triggered this rebuild (informational)'
        required: false
        type: string
      version:
        description: 'Version of the addon that triggered this rebuild (informational)'
        required: false
        type: string

jobs:
  rebuild:
    runs-on: docker01
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Add one more of these per addon this repo serves -- repo_generator.py picks up
      # any top-level folder with an addon.xml, no further changes needed.
      - name: Checkout plugin.video.mattflixhelper (latest)
        uses: actions/checkout@v4
        with:
          repository: BigMong/plugin.video.mattflixhelper
          token: ${{ secrets.GIT_TOKEN }}
          path: plugin.video.mattflixhelper

      - name: Read repository meta-addon version
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('repository.mattflixhelper/addon.xml').getroot().attrib['version'])")
          echo "REPO_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Generate repo (zips, addons.xml, checksum)
        run: python3 repo_generator.py

      - name: Publish repo_output to GitHub & Check Changes
        id: check-changes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: "bigmong/repository.mattflix"
          GH_BRANCH: "main"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/github-out
          REMOTE_URL="https://${GH_TOKEN}@github.com/${GH_REPO}.git"

          if git ls-remote --exit-code --heads "$REMOTE_URL" "$GH_BRANCH" >/dev/null 2>&1; then
            echo "Branch $GH_BRANCH exists. Cloning..."
            git clone --branch "$GH_BRANCH" --single-branch "$REMOTE_URL" /tmp/github-out
          else
            echo "Branch $GH_BRANCH does not exist. Initializing new repository..."
            mkdir -p /tmp/github-out
            cd /tmp/github-out
            git init
            git checkout -b "$GH_BRANCH"
            git remote add origin "$REMOTE_URL"
            cd "$GITHUB_WORKSPACE"
          fi

          rsync -a --delete --exclude='.git' repo_output/ /tmp/github-out/

          cd /tmp/github-out
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish to GitHub."
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update Kodi repo: ${{ inputs.module || 'manual rebuild' }} ${{ inputs.version }}"
            git push origin "$GH_BRANCH"
            echo "Successfully pushed repo to GitHub branch!"
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release & Attach Repository Zip
        if: steps.check-changes.outputs.changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: bigmong/repository.mattflix
          token: ${{ secrets.GH_PAT }}
          tag_name: v${{ env.REPO_VERSION }}
          name: Release v${{ env.REPO_VERSION }}
          prerelease: false
          files: |
            repo_output/repository.mattflixhelper/repository.mattflixhelper-${{ env.REPO_VERSION }}.zip
        env:
          GITHUB_API_URL: https://api.github.com
          GITHUB_SERVER_URL: https://github.com
